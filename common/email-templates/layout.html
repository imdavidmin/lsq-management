<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f4f1ee">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ee">
  <tr><td align="center" style="padding:24px 12px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px">
      <tr><td style="padding:0 4px 16px;font:600 17px/32px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#3b2a1e">
        <img src="{{app_url}}/logo-email.png" width="32" height="32" alt="" style="border:0;vertical-align:middle;margin-right:10px">{{site_name}}
      </td></tr>
      <tr><td style="background:#ffffff;border-radius:10px;padding:28px;font:15px/1.55 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#242424">
{{{content}}}
      </td></tr>
      <tr><td style="padding:16px 4px;font:12px/1.4 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#8a8580">
        Automated message from {{site_name}}.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
