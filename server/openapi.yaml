openapi: 3.1.0
info:
  title: LSQ Site Operations API
  version: 0.1.0
  description: >
    Board-owned site-operations + performance-scoring API for Lansbury Square.
    All HTTP endpoints below are served by the one `server` Worker, grouped by
    segment (tag). See docs/api.md for the route map and docs/architecture.md for
    design. Inbound email runs as two separate event-triggered Workers (`email`,
    `ai`) plus the cron on `server` — no HTTP surface, so not described here.

    Auth: all endpoints except the `auth` login pair require a `session` cookie
    (D17). Authorization is scoped RBAC (D18) — the permission named per
    operation must be carried by one of the caller's grants whose scope covers
    the target resource.
servers:
  # API is mounted under /api on the SAME origin as the frontend (served as the
  # server Worker's static assets). The API + cron are one Worker; inbound email
  # is separate (email + ai Workers, D20). To split the API onto an api.*
  # subdomain, drop the /api prefix in app.ts and change this back.
  - url: https://lansburysquare.co.uk/api
    description: Production

tags:
  - name: auth
    description: Passwordless OTP login + session (server segment)
  - name: tickets
    description: Tickets and their event timeline (server segment)
  - name: directory
    description: Accounts, grants, roles, buildings/units, orgs, senders (server segment)
  - name: scoring
    description: Performance fee, metric config/values, SLAs, scoring settings, reports (server segment)
  - name: engagement
    description: Surveys and site information (server segment)

security:
  - sessionCookie: []

paths:
  # ---------------------------------------------------------------- auth ---
  /auth/otp/request:
    post:
      tags: [auth]
      summary: Request a login code
      security: []
      description: Always responds 204 whether or not the email exists (no enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        # Always 204 — even when rate-limited — so the endpoint is
        # indistinguishable whether or not the email exists (no enumeration;
        # over-limit is silently dropped, see docs/security.md).
        "204": { description: Code sent if the email maps to an active account }
  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify a login code and open a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: httpOnly, Secure, SameSite=Lax session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Invalid, expired, or already-used code }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Session deleted }
  /auth/me:
    get:
      tags: [auth]
      summary: Current identity, grants and effective permissions
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me/access-log:
    get:
      tags: [auth]
      summary: Who has read the caller's own account PII (GDPR subject access, D22)
      description: >
        access_log rows where resource_type=account and resource_id is the
        caller. Self only; served as a CSV attachment with columns
        at, action (view|list|export), by (reader's name), detail (JSON, e.g.
        revealed fields).
      responses:
        "200":
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------- tickets ---
  /tickets:
    get:
      tags: [tickets]
      summary: List tickets visible to the caller
      description: Filtered by the caller's grants (permission ticket:read).
      parameters:
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/TicketStatus" },
          }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: building_id, schema: { type: integer } }
        - { in: query, name: unit_id, schema: { type: integer } }
        - {
            in: query,
            name: mine,
            schema: { type: boolean },
            description: Only tickets I created,
          }
        - {
            in: query,
            name: page,
            schema: { type: integer, default: 1, minimum: 1 },
          }
        - {
            in: query,
            name: per_page,
            schema: { type: integer, default: 25, maximum: 100 },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Ticket"
                        - type: object
                          properties:
                            events:
                              {
                                type: array,
                                items: { $ref: "#/components/schemas/Event" },
                              }
                  page: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tickets]
      summary: Create a ticket (UI only)
      description: Creator picks the category (or leaves it for an agent); id becomes the email address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tickets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [tickets]
      summary: Ticket detail with timeline
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Ticket"
                  - type: object
                    properties:
                      events:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Event" },
                        }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tickets]
      summary: Update status, category (reassign, UJ-06) or flags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/TicketStatus" }
                category: { type: string }
                needs_contractor: { type: boolean }
                is_duplicate: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tickets/{id}/attachments/{attachmentId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: attachmentId, required: true, schema: { type: integer } }
    get:
      tags: [tickets]
      summary: Download an email comment's attachment or original message (D28)
      description: >
        Streams the file from R2. Always sent with `X-Content-Type-Options: nosniff`
        and `Content-Security-Policy: sandbox`; only PNG/JPEG/GIF/WebP/PDF are
        served inline, everything else (incl. the `.eml` original) as a download.
      responses:
        "200":
          description: The file
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tickets/{id}/events:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [tickets]
      summary: Ticket event timeline
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Event" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tickets]
      summary: Add a comment / update (UI, UJ-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tickets/{id}/markers:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      tags: [tickets]
      summary: Record a manual SLA marker (D21)
      description: >
        Permission ticket:update. Only `attended` (contractor attended site) is
        entered by hand; `enquiry_sent` is inferred by the system. The notes go
        in the event body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marker, notes]
              properties:
                marker: { type: string, enum: [attended] }
                notes: { type: string, minLength: 1 }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------------- directory ---
  /accounts:
    get:
      tags: [directory]
      summary: List accounts (minimised)
      description: >
        GDPR data-minimisation (docs/gdpr.md): returns name, active status, role
        keys and the coarse building(s) a person is associated with — **no email
        and no exact unit**. Those are reveal-gated on GET /accounts/{id}. Writes
        one `list account` row to the read-access audit log.
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/AccountSummary" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [directory]
      summary: Create / invite an account
      description: >
        Creates the account and its grants, then emails an invitation.
        Activation is the passwordless OTP flow (docs/authentication.md) — the
        email points the recipient at sign-in, no separate token. A `unit`
        (free text, matched case-insensitively within `building_id`, created if
        new) adds a `resident` grant on that unit. Any role other than
        `resident` is granted on `org_id`'s organization if given, else
        estate-wide — so a board member sends role `board` plus their unit, and
        staff (e.g. concierge as `site_staff`) send no building or unit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role_key]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                role_key: { type: string, example: resident }
                building_id: { type: integer, nullable: true, description: Required with `unit`. }
                unit:
                  type: string
                  nullable: true
                  description: Unit label, e.g. "Flat 12". Required for `resident`.
                org_id: { type: integer, nullable: true }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: Unknown role/building/organization, or missing unit/building }
        "409": { description: Email already exists }
  /accounts/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [directory]
      summary: Account detail, with reveal-gated PII
      description: >
        Returns the minimised record by default (name, active, non-unit grants).
        `?reveal=email,units` unmasks the named PII: `email` adds the address,
        `units` adds the household-identifying unit-scoped grants. Every call
        writes a `view account` row to the read-access audit log recording which
        fields were revealed (docs/gdpr.md). RBAC scope remains the access gate;
        reveal only controls masking + what is audited.
      parameters:
        - in: query
          name: reveal
          description: Comma-separated PII fields to unmask and audit.
          schema:
            type: string
            example: email,units
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [directory]
      summary: Delete (erase) an account — move-out (D30)
      description: >
        Turns the account into an anonymous tombstone named for the household
        ("Resident of Flat 12, Banbury Point") or, for staff, the role (plus
        organization). Removes email, grants, sessions, login codes and extra
        addresses; rewrites stored raw From addresses to the tombstone; deletes
        the raw `original` emails they sent. Comment text and file attachments
        are kept. Appends an `erase` event (subject `account`). Irreversible.
        You can't delete your own account.
      responses:
        "204": { description: Erased }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [directory]
      summary: Rename or (de)activate an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /accounts/{id}/grants:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [directory]
      summary: Grants held by an account
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Grant" } }
  /accounts/{id}/emails:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      tags: [directory]
      summary: Add an extra inbound address to an account (D29)
      description: >
        Attributes inbound email from this address to the account. Never a
        login identity: OTP and notifications use the primary email. Listed via
        `GET /accounts/{id}?reveal=email`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "204": { description: Added }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Address already belongs to an account }
  /accounts/{id}/emails/{email}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: email, required: true, schema: { type: string } }
    delete:
      tags: [directory]
      summary: Remove an extra inbound address
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /grants:
    post:
      tags: [directory]
      summary: Assign a role scoped to a resource
      description: Ticket-scoped grants provide per-ticket sharing (UJ-08).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /grants/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    delete:
      tags: [directory]
      summary: Revoke a grant
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /roles:
    get:
      tags: [directory]
      summary: List roles and their permissions
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Role" } }
    post:
      tags: [directory]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key: { type: string }
                name: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
  /roles/{key}/permissions:
    parameters:
      - { in: path, name: key, required: true, schema: { type: string } }
    put:
      tags: [directory]
      summary: Replace a role's permission set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: { type: array, items: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
  /buildings:
    get:
      tags: [directory]
      summary: List buildings
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Building" },
                }
    post:
      tags: [directory]
      summary: Add a building
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
  /buildings/{id}/units:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [directory]
      summary: Units in a building
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Unit" } }
  /units:
    post:
      tags: [directory]
      summary: Add a unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [building_id, label]
              properties:
                building_id: { type: integer }
                label: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
  /organizations:
    get:
      tags: [directory]
      summary: List organizations (agent + contractors)
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Organization" },
                }
    post:
      tags: [directory]
      summary: Add an organization
      description: >-
        Defaults to a contractor. An optional `domain` adds a linked sender rule
        so mail from it is attributed to the org at once, and links any pending
        unknown senders at that domain. Personal mail domains are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "409":
          description: The domain already belongs to an organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /organizations/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      tags: [directory]
      summary: Edit an organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
  /senders:
    get:
      tags: [directory]
      summary: List sender rules
      description: "`?status=new` returns the unknown-sender queue (UJ-07)."
      parameters:
        - {
            in: query,
            name: status,
            schema: { type: string, enum: [new, ignored, linked] },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Sender" } }
    post:
      tags: [directory]
      summary: Add an email/domain → organization rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SenderCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sender" }
  /senders/{id}/account:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      tags: [directory]
      summary: Link an unknown email sender to a person (D29)
      description: >
        Moves the address onto the account as an extra inbound address and
        removes the sender row. Email senders only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties: { account_id: { type: integer } }
      responses:
        "204": { description: Linked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Address already belongs to an account }
  /senders/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      tags: [directory]
      summary: Link an unknown sender to an org, or ignore it (UJ-07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_id: { type: integer, nullable: true }
                status: { type: string, enum: [new, ignored, linked] }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sender" }
    delete:
      tags: [directory]
      summary: Remove a sender rule
      responses:
        "204": { description: Removed }

  /mail-aliases:
    get:
      tags: [directory]
      summary: List board-provisioned @lansburysquare.co.uk addresses (D26)
      description: >
        Requires `mail:read`. Aliases are one JSON doc (`config` row `mail_aliases`); each destination's
        `verified` flag comes live from Cloudflare Email Routing (the email
        Worker can only forward to verified destinations).
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/MailAlias" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /mail-aliases/{local_part}:
    parameters:
      - in: path
        name: local_part
        required: true
        description: "e.g. `board` for board@lansburysquare.co.uk; lowercase, not all digits"
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
    put:
      tags: [directory]
      summary: Create or replace an alias's destinations (board/admin, `mail:manage`)
      description: >
        The email Worker forwards a copy of each message to every destination.
        New destinations are registered with Cloudflare Email Routing and get a
        one-time verification email; they receive nothing until it's clicked.
        Every change is appended to `events` (subject_type `mail_alias`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forward_to]
              properties:
                forward_to:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: email }
                  description: External addresses only (not our own domains)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAlias" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: Cloudflare Email Routing call failed }
    delete:
      tags: [directory]
      summary: Remove an alias (`mail:manage`)
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /urgent-reply:
    get:
      tags: [directory]
      summary: The auto-reply sent to urgent mail at management@/concierge@ (D32)
      description: Requires `mail:read`. Plain text, sent and logged on the ticket as is.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrgentReply" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [directory]
      summary: Replace the urgent auto-reply (board/admin, `mail:manage`)
      description: Every change is appended to `events` (subject_type `config`, body `urgent_reply`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: { value: { type: string, minLength: 1, maxLength: 5000 } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrgentReply" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------- scoring ---
  /score:
    get:
      tags: [scoring]
      summary: Live performance fee and breakdown
      description: >
        Computed on-demand (UJ-10, D13). No caching. Only the ongoing and the
        just-ended service year can be scored; older years are a 400 (their
        figures live in the year-end snapshot). In the ongoing year a metric
        with no value yet is assumed met (result 1, `pending`).
      parameters:
        - {
            in: query,
            name: year,
            schema: { type: integer },
            description: Service year (labelled by the year it starts in); defaults to current,
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Score" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /score/metrics/{key}:
    parameters:
      - { in: path, name: key, required: true, schema: { type: string, example: res.ticket_acknowledgement } }
    get:
      tags: [scoring]
      summary: How one metric's score was arrived at, with its tickets
      description: >
        Permission score:read. Same evaluation and year rules as /score. For an
        SLA metric, every ticket an SLA applies to with its verdict and
        instances; for site inspection, the defect tickets (passes = raised by
        staff). A board dispute overrides the value, but the tickets are still listed.
      parameters:
        - { in: query, name: year, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /score/snapshots:
    get:
      tags: [scoring]
      summary: List year-end score snapshots, newest first (D21)
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [scoring]
      summary: Freeze the just-ended service year's score to R2 (D21)
      description: >
        Permission score:snapshot. Only the service year that has just ended is
        accepted. Writes the score, metric and SLA definitions, the year's SLA
        edits and every ticket's SLA instances, and appends a `snapshot` event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year: { type: integer }
      responses:
        "201":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Snapshot" }
                  - type: object
                    properties:
                      projected_fee_ratio: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /score/snapshots/{year}/{stamp}:
    parameters:
      - { in: path, name: year, required: true, schema: { type: integer } }
      - { in: path, name: stamp, required: true, schema: { type: string, example: 20270802T090000Z } }
    get:
      tags: [scoring]
      summary: Download one snapshot (JSON attachment)
      responses:
        "200":
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tickets/{id}/slas:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [scoring]
      summary: The ticket's SLA instances, evaluated now (D21)
      description: Permission sla:read, scoped to the ticket. Computed on read, never stored.
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/SlaInstance" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /metrics:
    get:
      tags: [scoring]
      summary: Metric configuration
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Metric" } }
    patch:
      tags: [scoring]
      summary: Bulk-edit weight / mode / threshold / active / description (D6)
      description: >
        Permission metric:manage. Patches are merged onto the stored table and
        applied together only if the result passes the whole-table rules:
        active weights sum to 1, each weight is 0..1, and a proportional
        metric's threshold is in (0, 1]. A 400's `message` lists one problem
        per line. Returns the full table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                type: object
                required: [key]
                properties:
                  key: { type: string }
                  weight: { type: number }
                  mode: { $ref: "#/components/schemas/MetricMode" }
                  threshold: { type: number, nullable: true }
                  active: { type: boolean }
                  description: { type: string, nullable: true }
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Metric" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /slas:
    get:
      tags: [scoring]
      summary: SLA definitions (D21)
      description: Permission sla:read. Evaluated on read against ticket events; never stored per ticket.
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Sla" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [scoring]
      summary: Create an SLA
      description: >
        Permission sla:manage. `metric_key` must be an auto metric; start/stop
        values must fit their kind (common/sla.ts). Appends a `config` event
        (subject_type=sla) to the audit spine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sla" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /slas/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      tags: [scoring]
      summary: Edit or (de)activate an SLA
      description: >
        Permission sla:manage. Any subset of SlaCreate fields; the merged row is
        validated as on create. No delete — set active=false. Appends a `config`
        event with the old and new row as JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sla" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /config:
    get:
      tags: [scoring]
      summary: Scoring settings
      description: >
        Permission config:read. Only the scoring keys (service_year_start);
        site_info has its own route.
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/ConfigEntry" } }
  /config/{key}:
    parameters:
      - { in: path, name: key, required: true, schema: { type: string, enum: [service_year_start] } }
    put:
      tags: [scoring]
      summary: Set a scoring setting
      description: >
        Permission config:manage. service_year_start is MM-DD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: { value: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /metric-values:
    get:
      tags: [scoring]
      summary: Manual/computed metric values
      description: Permission metric:read. All stored rows, newest first; latest per (metric, year) wins.
      parameters:
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: metric, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/MetricValue" },
                }
    post:
      tags: [scoring]
      summary: Enter a manual value, or dispute (superseding insert)
      description: >
        Admin/agent manual entry (UJ-15) and board dispute (UJ-08) are the same
        operation — a new row; latest per (metric, year) wins. Permission
        metric:enter; overriding an auto or survey metric also needs
        metric:dispute (board). The server derives `result` from the metric's
        mode and threshold. Only the ongoing or just-ended service year.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricValueCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricValue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /metric-values/{id}/attest:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      tags: [scoring]
      summary: Board sign-off on a value (UJ-15)
      description: Permission metric:attest. Appends an `attest` event on the value.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricValue" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reports/monthly:
    get:
      tags: [scoring]
      summary: Monthly performance report (UJ-11)
      description: Same generator the scheduler runs on the configured day (REPORT_DAY_OF_MONTH).
      parameters:
        - {
            in: query,
            name: month,
            required: true,
            schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlyReport" }

  # ---------------------------------------------------------- engagement ---
  /surveys:
    get:
      tags: [engagement]
      summary: List surveys
      responses:
        "200":
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Survey" } }
    post:
      tags: [engagement]
      summary: Create a survey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_year]
              properties:
                service_year: { type: integer }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }
  /surveys/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      tags: [engagement]
      summary: Open or close a survey (UJ-14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                closed: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }
  /surveys/{id}/responses:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [engagement]
      summary: View responses (admin, UJ-14)
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/SurveyResponse" },
                }
    post:
      tags: [engagement]
      summary: Submit a response (resident, one per UNIT, UJ-13)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                unit_id:
                  type: integer
                  description: >-
                    Unit the vote is cast for. Optional when the caller has
                    exactly one eligible unit; required when they have several.
                answers:
                  type: object
                  additionalProperties:
                    { type: integer, minimum: 1, maximum: 5 }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurveyResponse" }
        "409": { description: This unit has already responded to this survey }
  /surveys/{id}/responses/{rid}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: rid, required: true, schema: { type: integer } }
    patch:
      tags: [engagement]
      summary: Flag or unflag a response as an outlier (UJ-14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_outlier]
              properties: { is_outlier: { type: boolean } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurveyResponse" }
  /site-info:
    get:
      tags: [engagement]
      summary: Site information (contact details etc.) as markdown
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteInfo" }
    put:
      tags: [engagement]
      summary: Replace the site information markdown (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: { value: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteInfo" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Opaque server-side session token (D17); httpOnly, Secure, SameSite=Lax.

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing or invalid session
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: No grant carries the required permission for this resource
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found (or not visible to the caller)
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
      required: [error]

    Identity:
      type: object
      properties:
        account: { $ref: "#/components/schemas/Account" }
        grants: { type: array, items: { $ref: "#/components/schemas/Grant" } }
        permissions:
          type: array
          items: { type: string }
          description: Flattened permission set across all grants, for the UI.

    Account:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        active: { type: boolean }

    # Minimised directory row (GDPR): identity + coarse association only. No
    # email, no exact unit — see GET /accounts.
    AccountSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }
        roles:
          type: array
          items: { type: string }
          description: Distinct role keys held across the account's grants.
        buildings:
          type: array
          items: { type: string }
          description: Coarse building names the account is associated with (from building- and unit-scoped grants).

    # Account detail. email is present only when reveal=email; unit-scoped grants
    # are included only when reveal=units. Non-unit grants are always present.
    AccountDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }
        email: { type: string, format: email, description: Present only when reveal=email }
        emails:
          type: array
          items: { type: string, format: email }
          description: Extra inbound addresses (D29); present only when reveal=email.
        grants: { type: array, items: { $ref: "#/components/schemas/Grant" } }
        units:
          type: array
          items: { type: string }
          description: Resolved unit labels; present only when reveal=units.

    Role:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        permissions: { type: array, items: { type: string } }

    ScopeType:
      type: string
      enum: [estate, building, unit, organization, ticket]

    Grant:
      type: object
      properties:
        id: { type: integer }
        account_id: { type: integer }
        role_key: { type: string }
        scope_type: { $ref: "#/components/schemas/ScopeType" }
        scope_id:
          {
            type: integer,
            nullable: true,
            description: NULL only when scope_type=estate,
          }
    GrantCreate:
      type: object
      required: [account_id, role_key, scope_type]
      properties:
        account_id: { type: integer }
        role_key: { type: string }
        scope_type: { $ref: "#/components/schemas/ScopeType" }
        scope_id: { type: integer, nullable: true }

    Building:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Unit:
      type: object
      properties:
        id: { type: integer }
        building_id: { type: integer }
        label: { type: string }

    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [agent, contractor] }
        domains: { type: array, items: { type: string }, example: [acme.co.uk] }
    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind: { type: string, enum: [agent, contractor], default: contractor }
        domain: { type: string, example: acme.co.uk }
    OrganizationUpdate:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [agent, contractor] }

    UrgentReply:
      type: object
      required: [value, updated_at]
      properties:
        value: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }

    MailAlias:
      type: object
      required: [local_part, address, forward_to]
      properties:
        local_part: { type: string, example: board }
        address: { type: string, format: email, example: board@lansburysquare.co.uk }
        forward_to:
          type: array
          items:
            type: object
            required: [email, verified]
            properties:
              email: { type: string, format: email }
              verified:
                {
                  type: boolean,
                  nullable: true,
                  description: "null when the server has no Cloudflare token (dev)",
                }
    Sender:
      type: object
      properties:
        id: { type: integer }
        match_type: { type: string, enum: [email, domain] }
        match_value: { type: string }
        org_id:
          { type: integer, nullable: true, description: NULL = unknown/pending }
        status: { type: string, enum: [new, ignored, linked] }
        hit_count: { type: integer }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
    SenderCreate:
      type: object
      required: [match_type, match_value, org_id]
      properties:
        match_type: { type: string, enum: [email, domain] }
        match_value: { type: string }
        org_id: { type: integer }

    TicketStatus:
      type: string
      enum: [open, pending_3rd_party, resolved, closed]
    Ticket:
      type: object
      properties:
        id:
          {
            type: integer,
            description: Also the local part of the ticket's reply_to address,
          }
        reply_to:
          {
            type: string,
            format: email,
            description: "Inbound address for this ticket: <id>@ticket.lansburysquare.co.uk (D25)",
          }
        title: { type: string }
        building_id: { type: integer, nullable: true }
        unit_id: { type: integer, nullable: true }
        created_by: { type: integer, nullable: true }
        category: { type: string, nullable: true }
        classified_by: { type: string, enum: [resident, agent, board, admin, ai] }
        needs_contractor: { type: boolean }
        is_duplicate: { type: boolean }
        status: { $ref: "#/components/schemas/TicketStatus" }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
    TicketCreate:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        description:
          { type: string, description: Becomes the first event on the ticket }
        category:
          {
            type: string,
            nullable: true,
            description: Creator's chosen category; omit to leave unclassified for an agent,
          }
        building_id: { type: integer, nullable: true }
        unit_id: { type: integer, nullable: true }

    Event:
      type: object
      properties:
        id: { type: integer }
        subject_type:
          {
            type: string,
            description: "Polymorphic subject kind, e.g. ticket, metric_value",
          }
        subject_id:
          { type: integer, nullable: true, description: Id within subject_type; NULL = system-wide }
        at: { type: string, format: date-time }
        actor_id: { type: integer, nullable: true }
        actor_email: { type: string, nullable: true }
        actor_role: { type: string, nullable: true }
        type:
          {
            type: string,
            enum: [comment, classify, status, attest, chase, marker, config, snapshot],
          }
        from_value: { type: string, nullable: true }
        to_value: { type: string, nullable: true }
        body: { type: string, nullable: true }
        source: { type: string, enum: [ui, email, ai, system] }
        ai_processed: { type: boolean }
        ai_summary: { type: string, nullable: true }
        actor_name:
          {
            type: string,
            nullable: true,
            description: "Ticket timeline only: account name by actor_id or actor_email (incl. extra addresses), resolved at read time (D29)",
          }
        attachments:
          type: array
          description: Ticket timeline only (D28)
          items: { $ref: "#/components/schemas/Attachment" }

    Attachment:
      type: object
      required: [id, kind, filename, content_type, size]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [file, original], description: original = the raw .eml }
        filename: { type: string }
        content_type: { type: string }
        size: { type: integer }

    Snapshot:
      type: object
      properties:
        id: { type: string, description: "<year>/<stamp>, the download path", example: 2026/20270802T090000Z }
        service_year: { type: integer }
        taken_at: { type: string, format: date-time }

    SlaInstance:
      type: object
      description: One start→stop pair of an SLA on a ticket (D21).
      properties:
        sla_id: { type: integer }
        name: { type: string }
        metric_key: { type: string }
        budget_days: { type: integer }
        start_at: { type: string, format: date-time }
        stop_at: { type: string, format: date-time, nullable: true }
        days: { type: integer, description: Working days elapsed (to stop, or to now if open) }
        outcome: { type: string, enum: [met, breached, running] }

    MetricMode:
      type: string
      enum: [binary, proportional]
    Metric:
      type: object
      properties:
        key: { type: string }
        domain: { type: string, description: Display label only }
        weight:
          {
            type: number,
            description: Effective weight; all metrics sum to 1.0,
          }
        mode: { $ref: "#/components/schemas/MetricMode" }
        threshold: { type: number, nullable: true }
        source: { type: string, enum: [auto, manual, survey] }
        active: { type: boolean }
        description: { type: string, nullable: true }
    SlaKind:
      type: string
      enum: [ticket_created, status, event_by, marker]
      description: Start/stop kinds (common/sla.ts); ticket_created can only start.
    Sla:
      type: object
      required: [id, name, metric_key, category, needs_contractor, start_on, start_value, stop_on, stop_value, budget_days, repeats, active, description]
      properties:
        id: { type: integer }
        name: { type: string }
        metric_key: { type: string }
        category: { type: string, nullable: true, description: NULL = any category }
        needs_contractor: { type: boolean, nullable: true, description: NULL = any }
        start_on: { $ref: "#/components/schemas/SlaKind" }
        start_value: { type: string, nullable: true }
        stop_on: { $ref: "#/components/schemas/SlaKind" }
        stop_value: { type: string, nullable: true }
        budget_days: { type: integer, minimum: 1, description: Working days }
        repeats: { type: boolean, description: Re-arm each time the start fires }
        active: { type: boolean }
        description: { type: string, nullable: true }
    SlaCreate:
      type: object
      required: [name, metric_key, start_on, stop_on, budget_days]
      properties:
        name: { type: string }
        metric_key: { type: string }
        category: { type: string, nullable: true }
        needs_contractor: { type: boolean, nullable: true }
        start_on: { $ref: "#/components/schemas/SlaKind" }
        start_value: { type: string, nullable: true }
        stop_on: { $ref: "#/components/schemas/SlaKind" }
        stop_value: { type: string, nullable: true }
        budget_days: { type: integer, minimum: 1 }
        repeats: { type: boolean, default: false }
        active: { type: boolean, default: true }
        description: { type: string, nullable: true }
    SlaUpdate:
      type: object
      description: Any subset of SlaCreate.
      properties:
        name: { type: string }
        metric_key: { type: string }
        category: { type: string, nullable: true }
        needs_contractor: { type: boolean, nullable: true }
        start_on: { $ref: "#/components/schemas/SlaKind" }
        start_value: { type: string, nullable: true }
        stop_on: { $ref: "#/components/schemas/SlaKind" }
        stop_value: { type: string, nullable: true }
        budget_days: { type: integer, minimum: 1 }
        repeats: { type: boolean }
        active: { type: boolean }
        description: { type: string, nullable: true }
    ConfigEntry:
      type: object
      required: [key, value, updated_at]
      properties:
        key: { type: string }
        value: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }
    MetricValue:
      type: object
      properties:
        id: { type: integer }
        metric_key: { type: string }
        service_year: { type: integer }
        value: { type: number, description: Raw measured value }
        result: { type: number, description: 0..1 after mode+threshold }
        entered_by: { type: integer, nullable: true }
        attested_by: { type: integer, nullable: true }
        computed_at: { type: string, format: date-time }
        notes: { type: string, nullable: true }
    MetricValueCreate:
      type: object
      required: [metric_key, service_year, value]
      properties:
        metric_key: { type: string }
        service_year: { type: integer }
        value: { type: number }
        notes: { type: string }
    Score:
      type: object
      description: On-demand computed fee projection (UJ-10).
      properties:
        service_year: { type: integer }
        ongoing:
          { type: boolean, description: "The year hasn't ended; pending metrics count as met" }
        projected_fee_ratio:
          { type: number, description: Σ(weight × result), 0..1 }
        domains:
          type: array
          items:
            type: object
            properties:
              domain: { type: string }
              weight:
                {
                  type: number,
                  description: Derived SUM(weight) of its metrics,
                }
              result:
                { type: number, description: Weighted domain result, 0..1 }
              metrics:
                type: array
                items: { $ref: "#/components/schemas/MetricScore" }
    MetricScore:
      type: object
      properties:
        key: { type: string }
        source: { type: string, enum: [auto, manual, survey] }
        weight: { type: number }
        value: { type: number, nullable: true }
        result: { type: number, description: "0..1; pending → 1 while ongoing, else 0" }
        pending:
          { type: boolean, description: "No value yet, e.g. not entered or survey <50 responses" }
        basis:
          { type: string, description: "What the value rests on, e.g. '12 of 14 tickets on time'" }
    MetricDetail:
      type: object
      description: One metric's score and the tickets it was computed from.
      properties:
        service_year: { type: integer }
        ongoing: { type: boolean }
        metric: { $ref: "#/components/schemas/MetricScore" }
        tickets:
          type: array
          description: Empty for manual and survey metrics.
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              created_at: { type: string, format: date-time }
              passes:
                { type: boolean, nullable: true, description: "Counted as met/failed; null while no SLA has finished" }
              instances:
                type: array
                items: { $ref: "#/components/schemas/SlaInstance" }
    MonthlyReport:
      type: object
      properties:
        month: { type: string, example: "2026-08" }
        score: { $ref: "#/components/schemas/Score" }
        narrative:
          type: object
          properties:
            strong: { type: array, items: { type: string } }
            weak: { type: array, items: { type: string } }
            trend: { type: string, description: vs prior month }

    Survey:
      type: object
      properties:
        id: { type: integer }
        service_year: { type: integer }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        response_count: { type: integer }
        non_outlier_count: { type: integer }
        scoring_gate_met:
          { type: boolean, description: ">=50 non-outlier responses" }
    # Anonymous by design — no account link. Legitimacy is tracked separately in
    # survey_ballots (one-per-resident). See docs/gdpr.md.
    SurveyResponse:
      type: object
      properties:
        id: { type: integer }
        survey_id: { type: integer }
        answers: { type: object, additionalProperties: { type: integer } }
        is_outlier: { type: boolean }
        submitted_on: { type: string, format: date }

    SiteInfo:
      type: object
      properties:
        value: { type: string, description: Markdown body }
        updated_at: { type: string, format: date-time, nullable: true }
